<!DOCTYPE html>
<html lang="en" style="background-color: #000">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar System Model</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&family=Trispace:wght@200&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./style.scss" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
</head>

<body>
  <div id="intro" class="intro" role="dialog" aria-modal="true" aria-busy="true" aria-labelledby="intro-title"
    aria-describedby="intro-body">
    <div class="intro-panel">
      <p class="intro-kicker">Created by Kyle Gough</p>
      <h1 id="intro-title">Solar System Model</h1>
      <p class="intro-body" id="intro-body">
        An interactive 3D model of the Sun, planets, and major moons, with orbits,
        and points of interest. Double-click a planet to travel to
        it.
      </p>
      <div class="intro-load">
        <div class="intro-load-row">
          <span id="loader-text">Loading...</span>
          <span id="loader-percentage">0%</span>
        </div>
        <div class="intro-bar" id="loader-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"
          aria-valuenow="0" aria-labelledby="loader-text">
          <div class="intro-bar-fill" id="loader-bar-fill"></div>
        </div>
      </div>
      <p class="intro-hint" id="intro-hint" aria-hidden="true">
        Click anywhere to continue
      </p>
    </div>
  </div>
  <canvas class="webgl" tabindex="-1"></canvas>
  <div class="hud-end">
    <header class="identity">
      <p class="identity-kicker" id="identity-kicker">Star</p>
      <h1 id="identity-title">Sun</h1>
      <p class="identity-sub" id="identity-sub">
        Central star. Radius 432,000 km.
      </p>
    </header>
    <aside id="body-info" class="body-info" role="complementary" aria-label="Body information">
      <div class="body-info-toolbar">
        <button type="button" class="body-info-restore" id="body-info-restore" hidden>Info</button>
        <button type="button" class="body-info-minimise" id="body-info-minimise" aria-label="Minimise">−</button>
        <button type="button" class="body-info-close" id="body-info-close" aria-label="Close">×</button>
      </div>
      <div class="body-info-content">
        <p class="body-info-kicker" id="body-info-kicker">Star</p>
        <p class="body-info-blurb" id="body-info-blurb"></p>
        <dl class="body-info-stats" id="body-info-stats"></dl>
      </div>
    </aside>
  </div>
  <div class="btn-group">
    <a id="btn-github" href="https://github.com/KyleGough/solar-system" target="_blank"
      aria-label="View source" title="View source">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
        <g>
          <path
            d="M12 24a12 12 0 1 1 12-12 12.013 12.013 0 0 1-12 12zm0-22a10 10 0 1 0 10 10A10.011 10.011 0 0 0 12 2z" />
          <path
            d="M9.293 16.707 4.586 12l4.707-4.707 1.414 1.414L7.414 12l3.293 3.293-1.414 1.414zM14.707 16.707l-1.414-1.414L16.586 12l-3.293-3.293 1.414-1.414L19.414 12l-4.707 4.707z" />
        </g>
      </svg>
    </a>
    <button id="btn-labels" type="button" aria-label="Show labels" aria-pressed="true"
      title="Show labels">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
        <g>
          <path
            d="M12 24a12 12 0 1 1 12-12 12.013 12.013 0 0 1-12 12zm0-22a10 10 0 1 0 10 10A10.011 10.011 0 0 0 12 2z" />
          <path
            d="m12 19.414-.707-.707C10.751 18.166 6 13.318 6 10a6 6 0 0 1 12 0c0 3.318-4.751 8.166-5.293 8.707zM12 6a4 4 0 0 0-4 4c0 1.654 2.225 4.622 4 6.553 1.774-1.933 4-4.9 4-6.553a4 4 0 0 0-4-4z" />
          <path d="M11 8h2v2h-2z" />
        </g>
      </svg>
    </button>
    <button id="btn-paths" type="button" aria-label="Show orbit paths" aria-pressed="false"
      title="Show orbit paths">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
        <g>
          <path
            d="M12 24a12 12 0 1 1 12-12 12.013 12.013 0 0 1-12 12zm0-22a10 10 0 1 0 10 10A10.011 10.011 0 0 0 12 2z" />
          <path d="m7.091 16.91 1.964-7.856 7.854-1.964-1.964 7.856zM10.7 10.7l-.864 3.457L13.3 13.3l.864-3.457z" />
          <path d="m9.171 10.586 1.414-1.414 4.242 4.242-1.414 1.414z" />
        </g>
      </svg>
    </button>
    <button id="btn-spin" type="button" aria-label="Ride planet spin" aria-pressed="false" title="Ride planet spin">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
        <g>
          <path
            d="M12 24a12 12 0 1 1 12-12 12.013 12.013 0 0 1-12 12zm0-22a10 10 0 1 0 10 10A10.011 10.011 0 0 0 12 2z" />
          <path d="M12 9.5A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5z" />
          <path d="M12 6a6 6 0 1 1-5.29 3.06l1.74 1A4 4 0 1 0 12 8V6z" />
        </g>
      </svg>
    </button>
    <button id="btn-settings" type="button" aria-label="Simulation controls" aria-pressed="false"
      title="Simulation controls">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
        <g>
          <path
            d="M12 24a12 12 0 1 1 12-12 12.013 12.013 0 0 1-12 12zm0-22a10 10 0 1 0 10 10A10.011 10.011 0 0 0 12 2z" />
          <path d="M12 17a5 5 0 1 1 5-5 5.006 5.006 0 0 1-5 5zm0-8a3 3 0 1 0 3 3 3 3 0 0 0-3-3z" />
          <path
            d="M11 5h2v3h-2zM11 16h2v3h-2zM16 11h3v2h-3zM5 11h3v2H5zM14.293 8.293l2-2 1.414 1.414-2 2zM6.293 7.707l1.414-1.414 2 2-1.415 1.414zM6.293 16.293l2-2 1.414 1.414-2 2zM14.293 15.707l1.415-1.414 2 2-1.415 1.414z" />
        </g>
      </svg>
    </button>
  </div>
  <nav id="orbit-nav" class="orbit-nav" aria-label="Solar system"></nav>
  <script type="module" src="./script.ts"></script>
</body>

</html>
