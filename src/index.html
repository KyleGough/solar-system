<!DOCTYPE html>
<html lang="en" style="background-color: #000">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar System Model</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&family=Trispace:wght@200&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./style.scss" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
</head>

<body>
  <div id="intro" class="intro" role="dialog" aria-modal="true" aria-busy="true" aria-labelledby="intro-title"
    aria-describedby="intro-body">
    <div class="intro-panel">
      <p class="intro-kicker">Created by Kyle Gough</p>
      <h1 id="intro-title">Solar System Model</h1>
      <p class="intro-body" id="intro-body">
        An interactive 3D model of the Sun, planets, and major moons, with orbits,
        and points of interest. Double-click a planet to travel to
        it.
      </p>
      <div class="intro-load">
        <div class="intro-load-row">
          <span id="loader-text">Loading...</span>
          <span id="loader-percentage">0%</span>
        </div>
        <div class="intro-bar" id="loader-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"
          aria-valuenow="0" aria-labelledby="loader-text">
          <div class="intro-bar-fill" id="loader-bar-fill"></div>
        </div>
      </div>
      <p class="intro-hint" id="intro-hint" aria-hidden="true">
        Click anywhere to continue
      </p>
    </div>
  </div>
  <canvas class="webgl" tabindex="-1"></canvas>
  <div class="hud-end">
    <header class="identity">
      <p class="identity-kicker" id="identity-kicker">Star</p>
      <h1 id="identity-title">Sun</h1>
    </header>
    <aside id="body-info" class="body-info" role="complementary" aria-label="Body information">
      <div class="body-info-toolbar">
        <button type="button" class="body-info-restore" id="body-info-restore" hidden>Info</button>
        <button type="button" class="body-info-minimise" id="body-info-minimise" aria-label="Minimise">−</button>
        <button type="button" class="body-info-close" id="body-info-close" aria-label="Close" hidden>×</button>
        <button type="button" class="body-info-maximise" id="body-info-maximise" aria-label="Expand" hidden>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 4h5v5M20 4l-7 7M9 20H4v-5M4 20l7-7" />
          </svg>
        </button>
      </div>
      <div class="body-info-content">
        <p class="body-info-kicker" id="body-info-kicker">Star</p>
        <p class="body-info-blurb" id="body-info-blurb"></p>
        <dl class="body-info-stats" id="body-info-stats"></dl>
        <nav class="body-info-pips" id="body-info-pips" hidden aria-label="Points of interest"></nav>
      </div>
    </aside>
  </div>
  <div class="btn-group" role="toolbar" aria-label="View controls">
    <a class="hud-ctrl" id="btn-github" href="https://github.com/KyleGough/solar-system" target="_blank"
      rel="noopener noreferrer" aria-label="View source">
      <span class="hud-ctrl-disc" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M8.5 7 4 12l4.5 5M15.5 7 20 12l-4.5 5" />
        </svg>
      </span>
      <span class="hud-ctrl-label">Source</span>
    </a>
    <button class="hud-ctrl" id="btn-labels" type="button" aria-label="Show labels" aria-pressed="true">
      <span class="hud-ctrl-disc" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M12 20.5s-6.5-5.4-6.5-10.2a6.5 6.5 0 1 1 13 0c0 4.8-6.5 10.2-6.5 10.2z" />
          <circle cx="12" cy="10.3" r="2" />
        </svg>
      </span>
      <span class="hud-ctrl-label">Labels</span>
    </button>
    <button class="hud-ctrl" id="btn-paths" type="button" aria-label="Show orbit trails" aria-pressed="true">
      <span class="hud-ctrl-disc" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M5.8 15.4c1.8-4.6 6.4-7.2 11.2-5.6" />
          <circle class="is-fill" cx="17.2" cy="9.2" r="2.1" />
        </svg>
      </span>
      <span class="hud-ctrl-label">Trails</span>
    </button>
    <button class="hud-ctrl" id="btn-spin" type="button" aria-label="Ride planet spin" aria-pressed="false">
      <span class="hud-ctrl-disc" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M18.4 12a6.5 6.5 0 1 1-1.9-4.6" />
          <path class="is-fill" d="M16.2 4.4 19.8 7.2 15.5 8.6z" />
        </svg>
      </span>
      <span class="hud-ctrl-label">Spin</span>
    </button>
    <button class="hud-ctrl" id="btn-settings" type="button" aria-label="Simulation controls" aria-pressed="false">
      <span class="hud-ctrl-disc" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 5.2v-2M12 20.8v-2M18.8 12h2M3.2 12h2M16.6 7.4l1.5-1.5M5.9 18.1l1.5-1.5M16.6 16.6l1.5 1.5M5.9 5.9l1.5 1.5" />
        </svg>
      </span>
      <span class="hud-ctrl-label">Controls</span>
    </button>
  </div>
  <nav id="orbit-nav" class="orbit-nav" aria-label="Solar system"></nav>
  <script type="module" src="./script.ts"></script>
</body>

</html>
